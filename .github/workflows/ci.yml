name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AstraAgent.slnx --locked-mode

      - name: Build
        run: dotnet build AstraAgent.slnx --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format AstraAgent.slnx --verify-no-changes --no-restore

      - name: Test
        id: test
        run: dotnet test AstraAgent.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Report failed tests
        if: steps.test.outcome == 'failure'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.trx
          if (-not $files) {
            Write-Host "No TRX files found."
            exit 0
          }

          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $failed = foreach ($file in $files) {
            [xml]$doc = Get-Content $file.FullName
            Select-Xml -Xml $doc -XPath '//t:UnitTestResult[@outcome="Failed"]' -Namespace $ns |
              ForEach-Object { $_.Node }
          }

          if (-not $failed) {
            Write-Host "No failed tests in the TRX file."
            exit 0
          }

          foreach ($result in $failed) {
            $message = $result.Output.ErrorInfo.Message
            $escaped = $message -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Failed test::$($result.testName)%0A$escaped"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- FAILED: ``$($result.testName)``"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
